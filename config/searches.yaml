# Общие подборки: рассылаются ВСЕМ пользователям из users.yaml.
# Личные подборки каждый пользователь создаёт себе сам командами бота
# (/add, /schedule, /area, /rating, ...) — этот файл трогать не нужно.
#
# area (сверено с https://api.hh.ru/areas): 1 — Москва, 2 — Санкт-Петербург,
# 113 — вся Россия. Полный список: https://api.hh.ru/areas
# schedule: fullDay (полный день), shift (сменный), flexible (гибкий),
#   remote (удалённо), flyInFlyOut (вахта). Пусто = любой.
# search_field: everywhere (везде), name (в названии),
#   company_name (в компании), description (в описании).

searches:
  - id: terapevt
    name: "Врач-терапевт"
    text: "врач терапевт"
    search_field: everywhere
    area: [113]
    schedule: []
    employment: []
    experience: []
    salary_from: 0
    only_with_salary: false
    search_period: 3
    min_employer_rating: 0.0
    exclude_keywords: []
    max_results: 50
    notify_users: []

  - id: telemed
    name: "Телемедицина"
    text: "телемедицина"
    search_field: everywhere
    area: [113]
    schedule: []
    employment: []
    experience: []
    salary_from: 0
    only_with_salary: false
    search_period: 3
    min_employer_rating: 0.0
    exclude_keywords: []
    max_results: 50
    notify_users: []
