name: HH Vacancies Bot

on:
  schedule:
    # каждые 30 минут (GitHub гарантирует примерно; бесплатно ~2000 мин/мес)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # ручной запуск из вкладки Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hhbot
  cancel-in-progress: false

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch HH + send Telegram + build dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HH_ACCESS_TOKEN: ${{ secrets.HH_ACCESS_TOKEN }}  # опционально
          HH_USER_AGENT: ${{ secrets.HH_USER_AGENT }}      # опционально
        run: python src/main.py --send

      - name: Commit state (seen.json)
        run: |
          git config user.name "hhbot"
          git config user.email "hhbot@users.noreply.github.com"
          git add data/ docs/ config/users.yaml || true
          git diff --staged --quiet || git commit -m "bot: update $(date -u +%F_%H-%M)" || true
          git push || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: fetch-and-notify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
